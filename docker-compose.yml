services:
  curlmaster:
    build:
      context: .
      dockerfile: Dockerfile
    image: curlmaster-api:latest
    container_name: curlmaster
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Game__AccessCode: ${ACCESS_CODE:-linux_kernel_2026}
      Game__ArchivePassword: ${ARCHIVE_PASSWORD:-gdgvesiberay}
      Game__HttpsCertPassword: ${CERT_PASSWORD:-curlmaster}
      Admin__ApiKey: ${ADMIN_API_KEY:-change-me-in-production}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS:-}
      ForwardedHeaders__KnownProxies__0: ${KNOWN_PROXY:-}
      ForwardedHeaders__KnownNetworks__0: ${KNOWN_NETWORK:-}
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs
